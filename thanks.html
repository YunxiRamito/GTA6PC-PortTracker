<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d1b" />
<meta name="description" content="感谢支持 Port Tracker 的社区赞助者。" />
<title>鸣谢 · Port Tracker</title>
<link rel="preload" href="/assets/ui/barlow-condensed-900-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/thanks.css" />
<link rel="stylesheet" href="/assets/site-topbar.css" />
<script defer src="/assets/navigation.js"></script>
<script defer src="/thanks.js"></script>
<link rel="stylesheet" href="/assets/demo.css" />

<link rel="stylesheet" href="/assets/feedback.css" />
<link rel="stylesheet" href="/assets/danmaku.css" />
<script defer src="/assets/feedback.js"></script>
<script defer src="/assets/danmaku-mount.js"></script>
<script defer src="/assets/danmaku.js"></script>
</head>
<body class="thanks-page-body">
<a class="skip-link" href="#thanksMain">跳到主要内容</a>
<header class="site-topbar" data-site-topbar="overlay">
  <aside class="feedback-site-notice" id="siteNoticeStrip" aria-label="网站通知" aria-live="polite" aria-atomic="true" hidden>
    <div class="feedback-site-notice-inner"><p id="siteNoticeText"></p><button class="feedback-site-notice-close" id="siteNoticeClose" type="button" aria-label="关闭网站通知"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#dismiss" /></svg></button></div>
  </aside>
  <div class="site-nav">
    <a class="site-brand" href="/" aria-label="Port Tracker 主页">
      <span class="brand-mark demo-brand-mark" aria-hidden="true">VI</span>
      <span class="brand-word"><span>PORT</span><b>TRACKER</b></span>
    </a>
    <nav class="site-primary-nav" aria-label="网站主导航">
      <a href="/">主页</a>
      <a href="/thanks/" aria-current="page">鸣谢</a>
      <a href="/about/">关于</a>
    </nav>
    <div class="nav-actions">
      <a class="nav-action site-account" id="siteAccount" rel="noopener noreferrer" hidden>
        <svg class="ui-icon site-account-icon" aria-hidden="true"><use /></svg>
        <span id="siteAccountLabel">登录</span>
        <img class="site-account-avatar" id="siteAccountAvatar" width="36" height="36" crossorigin="use-credentials" alt="" hidden />
      </a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="打开网站菜单" aria-haspopup="dialog" aria-controls="siteMenu" aria-expanded="false">
        <span class="menu-glyph" aria-hidden="true"><span></span><span></span></span>
      </button>
    </div>
  </div>
</header>
<dialog class="chapter-menu" id="siteMenu" aria-labelledby="menuTitle">
  <div class="menu-backdrop-brand" aria-hidden="true"><span class="brand-mark demo-brand-mark" aria-hidden="true">VI</span></div>
  <div class="menu-panel" data-lenis-prevent>
    <div class="menu-head">
      <div><p class="micro">GTA VI COMMUNITY</p><h2 id="menuTitle">PORT TRACKER</h2></div>
      <button class="menu-close menu-toggle" id="menuClose" type="button" aria-label="关闭网站菜单" autofocus><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#dismiss" /></svg></button>
    </div>
    <nav class="menu-primary" aria-label="网站菜单链接">
      <a href="/">主页</a>
      <a href="/thanks/" aria-current="page">鸣谢</a>
      <a href="/about/">关于</a>
    </nav>
    <div class="menu-footer"><a class="text-link" href="/feedback/">反馈说明 <svg class="ui-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#arrow-up-right" /></svg></a></div>
  </div>
</dialog>

<main class="thanks-main" id="thanksMain" tabindex="-1">
  <section class="thanks-hero" aria-labelledby="thanksTitle">
    <div class="thanks-hero-art" aria-hidden="true">
    </div>
    <div class="thanks-sky" id="thanksSky" aria-hidden="true"></div>
    <div class="thanks-hero-copy content-width">
      <p class="thanks-eyebrow">社区鸣谢</p>
      <h1 class="thanks-title" id="thanksTitle"><span lang="en">Thank</span> <span lang="en">You</span></h1>
      <p class="thanks-lead">这份虚构名单用于演示社区鸣谢页。</p>
    </div>
  </section>

  <section class="thanks-credits content-width" aria-labelledby="creditsTitle">
    <div class="thanks-credits-head">
      <h2 class="thanks-credits-title" id="creditsTitle">赞助者</h2>
      <p class="thanks-count" id="sponsorCount" aria-live="polite"></p>
    </div>

    <div class="thanks-state" id="sponsorState" data-state="loading" role="status" aria-live="polite" aria-atomic="true">
      <p class="thanks-state-panel" data-panel="loading">正在读取名单…</p>
      <div class="thanks-state-panel" data-panel="error" hidden>
        <p>名单暂时读取失败，请检查网络后重试。</p>
        <button class="thanks-retry" id="retrySponsors" type="button">重新读取</button>
      </div>
      <p class="thanks-state-panel" data-panel="empty" hidden>名单还是空的。</p>
    </div>

    <ol class="thanks-roll" id="sponsorList" aria-labelledby="creditsTitle" hidden></ol>
  </section>
</main>

<footer class="thanks-footer content-width">
  <p>本站为独立社区项目，与 Rockstar Games 无关联。</p>
  <a href="/" class="thanks-footer-link">返回首页 <span aria-hidden="true">↗</span></a>
</footer>
<div data-danmaku-mount></div>
</body>
</html>
