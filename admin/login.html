<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d1a">
  <meta name="robots" content="noindex, nofollow">
  <title>登录 · LOCAL CONSOLE 账户</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/admin/login.css">
  <link rel="stylesheet" href="/assets/site-topbar.css" />
  <script defer src="/assets/navigation.js"></script>
  <script src="/admin/avatar.js" defer></script>
  <script src="/admin/login.js" defer></script>
<link rel="stylesheet" href="/assets/demo.css" />
</head>
<body class="login-body">
  <a class="skip-link" href="#main">跳到主内容</a>
  <header class="site-topbar" data-site-topbar="login">
      <div class="site-nav">
      <a class="site-brand" href="/" data-site-path="/" aria-label="Port Tracker 主页">
        <span class="brand-mark demo-brand-mark" aria-hidden="true">VI</span>
        <span class="brand-word"><span>PORT</span><b>TRACKER</b></span>
      </a>
      <nav class="site-primary-nav" aria-label="网站主导航">
        <a href="/" data-site-path="/">主页</a>
        <a href="/thanks/" data-site-path="/thanks/">鸣谢</a>
        <a href="/about/" data-site-path="/about/">关于</a>
      </nav>
      <div class="nav-actions">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="打开网站菜单" aria-haspopup="dialog" aria-controls="siteMenu" aria-expanded="false">
          <span class="menu-glyph" aria-hidden="true"><span></span><span></span></span>
        </button>
      </div>
    </div>
  </header>
  <dialog class="chapter-menu" id="siteMenu" aria-labelledby="menuTitle">
    <div class="menu-backdrop-brand" aria-hidden="true"><span class="brand-mark demo-brand-mark" aria-hidden="true">VI</span></div>
    <div class="menu-panel" data-lenis-prevent>
      <div class="menu-head">
        <div><p class="micro">GTA VI COMMUNITY</p><h2 id="menuTitle">PORT TRACKER</h2></div>
        <button class="menu-close menu-toggle" id="menuClose" type="button" aria-label="关闭网站菜单" autofocus><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#dismiss" /></svg></button>
      </div>
      <nav class="menu-primary" aria-label="网站菜单链接">
        <a href="/" data-site-path="/">主页</a>
        <a href="/thanks/" data-site-path="/thanks/">鸣谢</a>
        <a href="/about/" data-site-path="/about/">关于</a>
      </nav>
      <div class="menu-footer"><a class="text-link" href="/feedback/" data-site-path="/feedback/">反馈说明 <svg class="ui-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#arrow-up-right" /></svg></a></div>
    </div>
  </dialog>
  <main class="login-layout" id="main" tabindex="-1">
    <section class="login-card" id="login-card" aria-labelledby="login-title">
      <a class="login-brand" href="/admin/login" aria-label="LOCAL CONSOLE">
        <span class="brand-edition">LOCAL CONSOLE</span>
        <strong>账户</strong>
      </a>

      <div class="login-heading">
        <h1 id="login-title">登录</h1>
      </div>

      <form id="login-form" class="login-form" action="/api/admin/session" method="post" enctype="application/x-www-form-urlencoded">
        <div class="field" id="username-field">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="login-feedback">
        </div>
        <div class="field">
          <label for="password" id="password-label">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-feedback retry-feedback">
        </div>
        <div class="login-feedback" id="login-feedback" data-tone="neutral" role="status" aria-live="polite"></div>
        <p class="retry-feedback" id="retry-feedback" hidden aria-hidden="true"></p>
        <button class="button primary login-submit" id="login-submit" type="submit" disabled>登录并继续</button>
      </form>
      <button class="text-button login-switch" id="show-registration" type="button" hidden>创建账户</button>
      <noscript>请启用 JavaScript 后登录。</noscript>
    </section>

    <section class="login-card registration-card" id="registration-card" aria-labelledby="registration-title" hidden>
      <a class="login-brand" href="/admin/login" aria-label="LOCAL CONSOLE">
        <span class="brand-edition">LOCAL CONSOLE</span>
        <strong>账户</strong>
      </a>
      <div class="login-heading">
        <h1 id="registration-title" tabindex="-1">创建账户</h1>
        <p>用户名创建后不能修改。</p>
      </div>
      <form id="registration-form" class="login-form" novalidate>
        <div class="field">
          <label for="registration-nickname">昵称</label>
          <input id="registration-nickname" name="nickname" maxlength="40" autocomplete="nickname" required aria-describedby="registration-feedback">
        </div>
        <div class="field">
          <label for="registration-username">用户名</label>
          <input id="registration-username" name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="username-help registration-feedback">
          <p class="hint" id="username-help">3–32 个英文字母、数字或 . _ -</p>
        </div>
        <div class="field">
          <label for="registration-email">邮箱 <span class="hint">（可选）</span></label>
          <input id="registration-email" name="email" type="email" maxlength="254" autocomplete="email" aria-describedby="registration-feedback">
        </div>
        <fieldset class="avatar-field">
          <legend>头像 <span class="hint">（可选）</span></legend>
          <label class="button avatar-file-button" for="registration-avatar-file">选择本地图片</label>
          <input class="visually-hidden" id="registration-avatar-file" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="registration-avatar-help registration-avatar-status registration-feedback">
          <p class="hint" id="registration-avatar-help">PNG、JPEG 或 WebP，最大 10 MB。</p>
          <canvas class="avatar-crop-canvas" id="registration-avatar-canvas" width="256" height="256" role="img" aria-label="128 × 128 头像裁切预览；选择图片后可拖动调整"></canvas>
          <div class="avatar-controls" id="registration-avatar-controls" hidden>
            <label for="registration-avatar-x">水平位置</label>
            <input id="registration-avatar-x" type="range" min="0" max="1000" value="500" aria-label="头像水平裁切位置">
            <label for="registration-avatar-y">垂直位置</label>
            <input id="registration-avatar-y" type="range" min="0" max="1000" value="500" aria-label="头像垂直裁切位置">
            <label for="registration-avatar-zoom">缩放</label>
            <input id="registration-avatar-zoom" type="range" min="100" max="400" value="100" aria-label="头像缩放比例">
            <div class="avatar-actions">
              <button class="button" id="registration-avatar-reset" type="button">重置裁切</button>
              <button class="button" id="registration-avatar-remove" type="button">移除头像</button>
            </div>
          </div>
          <p class="hint" id="registration-avatar-status" role="status" aria-live="polite">尚未选择头像。</p>
        </fieldset>
        <div class="field">
          <label for="registration-password">密码</label>
          <input id="registration-password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-help registration-feedback">
          <p class="hint" id="password-help">至少 8 个字符，包含至少 1 个英文字母。</p>
        </div>
        <div class="field">
          <label for="registration-confirm-password">确认密码</label>
          <input id="registration-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="registration-feedback">
        </div>
        <div class="login-feedback" id="registration-feedback" data-tone="neutral" role="status" aria-live="polite"></div>
        <button class="button primary login-submit" id="registration-submit" type="submit" disabled>创建账户</button>
      </form>
      <button class="text-button login-switch" id="show-login" type="button">返回登录</button>
    </section>
  <p class="admin-local-help">首次运行时，请先用仓库提供的命令初始化本地站长账号。</p>
</main>
</body>
</html>
