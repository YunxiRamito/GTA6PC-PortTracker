<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#10111f" />
<meta name="description" data-i18n-content="pages.feedback.description" content="向 GTA VI PC 移植观测站提交意见、纠错与使用体验。" />
<title data-i18n="pages.feedback.title">反馈说明 · GTA VI PC 移植观测站</title>
<link rel="preload" href="/assets/ui/barlow-condensed-900-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/assets/site-topbar.css" />
<link rel="stylesheet" href="/assets/i18n.css" />
<script defer src="/assets/i18n.js"></script>
<script defer src="/assets/i18n-pages.js"></script>
<script defer src="/assets/i18n-widgets.js"></script>
<script defer src="/assets/navigation.js"></script>
<link rel="stylesheet" href="/assets/demo.css" />

<link rel="stylesheet" href="/assets/feedback.css" />
<link rel="stylesheet" href="/assets/danmaku.css" />
<script defer src="/assets/feedback.js"></script>
<script defer src="/assets/danmaku-mount.js"></script>
<script defer src="/assets/danmaku.js"></script>
<script defer src="/assets/danmaku-translate.js"></script>
</head>
<body class="feedback-page-body">
<a class="skip-link" href="#content" data-i18n="pages.shared.skip">跳到主要内容</a>
<header class="site-topbar" data-site-topbar="inline">
  <aside class="feedback-site-notice" id="siteNoticeStrip" data-i18n-aria-label="pages.shared.siteNotice" aria-label="网站通知" aria-live="polite" aria-atomic="true" hidden>
    <div class="feedback-site-notice-inner"><p id="siteNoticeText"></p><button class="feedback-site-notice-close" id="siteNoticeClose" type="button" data-i18n-aria-label="pages.shared.dismissNotice" aria-label="关闭网站通知"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#dismiss" /></svg></button></div>
  </aside>
  <div class="site-nav">
    <a class="site-brand" href="/" data-i18n-aria-label="pages.shared.brandHome" aria-label="Port Tracker 主页">
      <span class="brand-mark demo-brand-mark" aria-hidden="true">VI</span>
      <span class="brand-word"><span>PORT</span><b>TRACKER</b></span>
    </a>
    <nav class="site-primary-nav" data-i18n-aria-label="pages.shared.primaryNav" aria-label="网站主导航">
      <a href="/" data-i18n="pages.shared.home">主页</a>
      <a href="/thanks/" data-i18n="pages.shared.thanks">鸣谢</a>
      <a href="/about/" data-i18n="pages.shared.about">关于</a>
    </nav>
    <div class="nav-actions">
      <a class="nav-action site-account" id="siteAccount" rel="noopener noreferrer" hidden>
        <svg class="ui-icon site-account-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#person" /></svg>
        <span id="siteAccountLabel" data-i18n="pages.shared.login">登录</span>
        <img class="site-account-avatar" id="siteAccountAvatar" width="36" height="36" crossorigin="use-credentials" alt="" hidden />
      </a>
      <button class="menu-toggle" id="menuToggle" type="button" data-i18n-aria-label="pages.shared.openMenu" aria-label="打开网站菜单" aria-haspopup="dialog" aria-controls="siteMenu" aria-expanded="false">
        <span class="menu-glyph" aria-hidden="true"><span></span><span></span></span>
      </button>
    </div>
  </div>
</header>
<dialog class="chapter-menu" id="siteMenu" aria-labelledby="menuTitle">
  <div class="menu-backdrop-brand" aria-hidden="true"><span class="brand-mark demo-brand-mark" aria-hidden="true">VI</span></div>
  <div class="menu-panel" data-lenis-prevent>
    <div class="menu-head">
      <div><p class="micro" data-i18n="pages.shared.community">GTA VI COMMUNITY</p><h2 id="menuTitle">PORT TRACKER</h2></div>
      <button class="menu-close menu-toggle" id="menuClose" type="button" data-i18n-aria-label="pages.shared.closeMenu" aria-label="关闭网站菜单" autofocus><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#dismiss" /></svg></button>
    </div>
    <nav class="menu-primary" data-i18n-aria-label="pages.shared.menuLinks" aria-label="网站菜单链接">
      <a href="/" data-i18n="pages.shared.home">主页</a>
      <a href="/thanks/" data-i18n="pages.shared.thanks">鸣谢</a>
      <a href="/about/" data-i18n="pages.shared.about">关于</a>
    </nav>
    <div class="menu-footer"><a class="text-link" href="/feedback/" data-i18n-own="pages.shared.feedback">反馈说明 <svg class="ui-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#arrow-up-right" /></svg></a></div>
  </div>
</dialog>
<main class="feedback-main" id="content" tabindex="-1">
  <section class="feedback-card" aria-labelledby="feedbackTitle">
    <h1 id="feedbackTitle" data-i18n-own="pages.feedback.headingStart">反馈<span data-i18n="pages.feedback.headingAccent">建议</span></h1>
    <p class="feedback-intro" data-i18n="pages.feedback.intro">发现错误、想补充线索，或有使用建议？欢迎留言。</p>
    <form class="feedback-form" id="feedbackForm" method="post">
      <label class="feedback-label" for="feedbackText" data-i18n="pages.feedback.label">你的反馈</label>
      <textarea id="feedbackText" name="text" maxlength="2000" rows="7" data-i18n-placeholder="pages.feedback.placeholder" placeholder="尽量说清楚相关页面或情况…" aria-describedby="feedbackHint feedbackCount" required></textarea>
      <div class="feedback-field-meta">
        <p class="feedback-hint" id="feedbackHint" data-i18n="pages.feedback.privacy">请勿填写密码、联系方式等敏感信息。</p>
        <span class="feedback-count" id="feedbackCount">0 / 1000</span>
      </div>
      <div class="feedback-submit-row">
        <button class="feedback-submit" id="feedbackSubmit" type="submit" disabled>
          <span data-i18n="pages.feedback.send">发送反馈</span>
          <svg class="ui-icon" aria-hidden="true"><use href="/assets/ui/fluent.svg#arrow-right" /></svg>
        </button>
        <p class="feedback-status" id="feedbackStatus" data-tone="neutral" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>
    </form>
    <noscript><p class="feedback-status" data-i18n="pages.feedback.requiresJavaScript">启用 JavaScript 后才能发送反馈。</p></noscript>
    <p class="feedback-card-foot" data-i18n="pages.feedback.reply">请用同一浏览器和站点地址再次访问，站务回复会在页面上弹出。</p>
  </section>
</main>
<footer class="feedback-footer">
  <div class="feedback-footer-inner content-width">
    <p data-i18n="pages.feedback.disclaimer">独立社区观测站，仅收录公开项目与活动。本站与 Rockstar Games 无关联。</p>
  </div>
</footer>
<div data-danmaku-mount></div>
</body>
</html>
